<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <!-- Category Buttons -->
    <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="nature">Nature</button>
        <button class="filter" data-filter="city">City</button>
        <button class="filter" data-filter="travel">Travel</button>
        <button class="filter" data-filter="people">People</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                 alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=800&q=80"
                 alt="City">
            <div class="caption">City Lights</div>
        </div>

        <div class="gallery-item travel">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                 alt="Beach">
            <div class="caption">Beach Travel</div>
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80"
                 alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="gallery-item people">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80"
                 alt="Person">
            <div class="caption">Portrait</div>
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80"
                 alt="City">
            <div class="caption">Modern City</div>
        </div>

        <div class="gallery-item travel">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain">
            <div class="caption">Mountain Journey</div>
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=800&q=80"
                 alt="Waterfall">
            <div class="caption">Waterfall</div>
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>

        <button class="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button class="next">&#10095;</button>
    </div>

    <footer>
        <p>CodeAlpha Frontend Development Internship</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
